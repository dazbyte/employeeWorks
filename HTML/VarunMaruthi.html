<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Varun Motors Navbar</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <style>
        .navbar {
            background-color: rgb(35, 35, 68);
        }
        .navbar-brand img {
            height: 60px;
            width: auto;
        }
        .navbar-nav .nav-link {
            font-weight: 600;
            color: rgb(234, 237, 245);
        }
        .navbar-nav .nav-link:hover {
            color: paleturquoise;
        }
        .carousel-item {
            height: 800px;
        }
        #carouselExample {
            background-color: rgb(35, 35, 68);
        }
        .carousel-item img {
            width: 100%;
            height: 950px;
            object-fit: contain;
            transform: translateY(-20px);
        }
    
    </style>
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-light border-bottom">
    <div class="container">
        <a class="navbar-brand" href="#">
            <img src="../Assets/VM-images/pngtree-mv-vm-letter-vector-logo-image_332121.jpg" alt="Varun Motors">
        </a>
        <button class="navbar-toggler bg-light" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"
                aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon bg-light"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav ms-auto">
                <li class="nav-item"><a class="nav-link" href="#">Home</a></li>
                <li class="nav-item"><a class="nav-link" href="#">About Us</a></li>
                <li class="nav-item dropdown">
                    <a class="nav-link dropdown-toggle" href="#" id="newCarsDropdown" role="button" data-bs-toggle="dropdown"
                       aria-expanded="false">New Cars</a>
                    <ul class="dropdown-menu" aria-labelledby="newCarsDropdown">
                        <li><a class="dropdown-item" href="#">Hatchbacks</a></li>
                        <li><a class="dropdown-item" href="#">Sedans</a></li>
                        <li><a class="dropdown-item" href="#">SUVs</a></li>
                    </ul>
                </li>
                <li class="nav-item"><a class="nav-link" href="#">True Value</a></li>
                <li class="nav-item"><a class="nav-link" href="#">Outlets</a></li>
                <li class="nav-item dropdown">
                    <a class="nav-link dropdown-toggle" href="#" id="servicesDropdown" role="button" data-bs-toggle="dropdown"
                       aria-expanded="false">Our Services</a>
                    <ul class="dropdown-menu" aria-labelledby="servicesDropdown">
                        <li><a class="dropdown-item" href="#">Car Service</a></li>
                        <li><a class="dropdown-item" href="#">Insurance</a></li>
                    </ul>
                </li>
                <li class="nav-item"><a class="nav-link" href="#">Contact Us</a></li>
                <li class="nav-item"><a class="nav-link" href="#">Offers</a></li>
            </ul>
        </div>
    </div>
</nav>

<div id="carouselExample" class="carousel slide" data-bs-ride="carousel" data-bs-interval="5000">
    <div class="carousel-inner">
        <div class="carousel-item active">
            <img src="../Assets/VM-images/car8.jpg" class="d-block w-100" alt="Image 1">
        </div>
        <div class="carousel-item">
            <img src="../Assets/VM-images/car5.avif" class="d-block w-100" alt="Image 2">
        </div>
        <div class="carousel-item">
            <img src="../Assets/VM-images/car9.jpg" class="d-block w-100" alt="Image 3">
        </div>
    </div>

    <!-- Left and right controls -->
    <button class="carousel-control-prev" type="button" data-bs-target="#carouselExample" data-bs-slide="prev">
        <span class="carousel-control-prev-icon" aria-hidden="true"></span>
        <span class="visually-hidden">Previous</span>
    </button>
    <button class="carousel-control-next" type="button" data-bs-target="#carouselExample" data-bs-slide="next">
        <span class="carousel-control-next-icon" aria-hidden="true"></span>
        <span class="visually-hidden">Next</span>
    </button>
</div>

</body>
</html>
